<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Principal investigator avatar placeholder">
  <defs>
    <linearGradient id="piAvatarBg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e2a35" />
      <stop offset="1" stop-color="#06151c" />
    </linearGradient>
    <linearGradient id="piAvatarText" x1="90" y1="120" x2="210" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#43c5de" />
      <stop offset="1" stop-color="#e4a845" />
    </linearGradient>
    <radialGradient id="piAvatarGlow" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#43c5de" stop-opacity="0.18" />
      <stop offset="1" stop-color="#43c5de" stop-opacity="0" />
    </radialGradient>
    <pattern id="piAvatarDots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#43c5de" fill-opacity="0.1" />
    </pattern>
  </defs>

  <circle cx="150" cy="150" r="150" fill="url(#piAvatarBg)" />
  <circle cx="150" cy="150" r="150" fill="url(#piAvatarDots)" />
  <circle cx="150" cy="150" r="150" fill="url(#piAvatarGlow)" />

  <text
    x="150"
    y="150"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="110"
    font-weight="400"
    fill="url(#piAvatarText)"
  >TD</text>
</svg>
