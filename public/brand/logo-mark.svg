    <path d="M32 12.5 41 17.5 32 22.5 23 17.5Z" fill="#fffdf8" stroke-width="2.5"/>
    <!-- ledger lines on the right face -->
    <path d="M37 33.5 49 26.5M37 40 49 33M37 46.5 44 42.5" fill="none" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
