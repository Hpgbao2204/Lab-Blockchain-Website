<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Blockchainist">
  <g stroke="#16140f" stroke-width="3" stroke-linejoin="round">
    <!-- hard offset shadow -->
    <path d="M35 9 57 21.5V47.5L35 60 13 47.5V21.5Z" fill="#16140f"/>
    <!-- cube -->
    <path d="M32 5 54 17.5 32 30 10 17.5Z" fill="#ffc730"/>
    <path d="M10 17.5 32 30V55L10 42.5Z" fill="#3d8bff"/>
    <path d="M54 17.5 32 30V55L54 42.5Z" fill="#fffdf8"/>
